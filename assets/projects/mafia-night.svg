      :root { --surface: #111820; --border: #363f49; --text: #f0f6fc; --secondary: #c9d1d9; --muted: #a5aeb8; --accent: #c9abff; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  </style>
  <rect x="2.5" y="2.5" width="401" height="131" rx="9" fill="var(--surface)" stroke="var(--border)"/>
  <g transform="translate(19 17)">

name: Update Miko's aquarium

on:
  schedule:
    - cron: '20 0 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: miko-aquarium
  cancel-in-progress: false

jobs:
  render:
    if: github.ref_name == github.event.repository.default_branch && github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Generate Miko from public GitHub activity
        uses: yalongwastaken/git-koi@7305e9b1fadee6f43d3b4fa543a25d4cde79856e # v1.0.2
        with:
          login: ${{ github.repository_owner }}
          body: white
          output-dir: ${{ runner.temp }}/miko-koi

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Render the aquarium
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: Pillow==13.0.0
          python scripts/render_aquarium.py "$RUNNER_TEMP/miko-koi/koi.gif" "$RUNNER_TEMP/miko-aquarium"
          test -s "$RUNNER_TEMP/miko-aquarium/aquarium.gif"
          test -s "$RUNNER_TEMP/miko-aquarium/aquarium.png"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: miko-aquarium
          path: |
            ${{ runner.temp }}/miko-aquarium/aquarium.gif
            ${{ runner.temp }}/miko-aquarium/aquarium.png
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  publish:
    needs: render
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: miko-aquarium
          path: ${{ runner.temp }}/miko-aquarium

      - name: Publish changed images
        env:
          PROFILE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch --no-tags origin "$PROFILE_BRANCH"
            git switch --quiet --detach FETCH_HEAD
            mkdir -p assets/miko
            cp "$RUNNER_TEMP/miko-aquarium"/aquarium.{gif,png} assets/miko/
            git add -- assets/miko/aquarium.gif assets/miko/aquarium.png
            if git diff --cached --quiet; then
              echo 'Both aquarium images are already current.'
              exit 0
            fi
            if ! git diff --quiet "$GITHUB_SHA" HEAD -- scripts/render_aquarium.py .github/workflows/miko.yml assets/miko; then
              echo 'The aquarium changed during this run. Run the workflow again on the latest revision.'
              exit 1
            fi
            git commit -m "Refresh Miko's aquarium"
            if git push origin "HEAD:refs/heads/$PROFILE_BRANCH"; then
              exit 0
            fi
          done
          echo 'Could not publish after three fast-forward attempts.'
          exit 1

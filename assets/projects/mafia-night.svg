    <g transform="translate(4.2 4.2) scale(.9)" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m3 8 5-2 4 2 4-2 5 2-1.5 6.5c-.8 3-4 4.5-7.5 5.5-3.5-1-6.7-2.5-7.5-5.5Z"/><path d="m6.7 11.2 3.1 1.1m4.4 0 3.1-1.1"/></g>

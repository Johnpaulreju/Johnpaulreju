name: Update contribution snake

on:
  schedule:
    - cron: '47 0 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  render:
    if: github.ref_name == github.event.repository.default_branch && github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Generate both snakes from the same contribution calendar
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#c4a7ff
            dist/snake-light.svg?palette=github-light&color_snake=#7c3aed

      - name: Style each animation for standalone viewing
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET

          namespace = "http://www.w3.org/2000/svg"
          ET.register_namespace("", namespace)
          for theme, background in {"dark": "#0d1117", "light": "#ffffff"}.items():
              path = Path(f"dist/snake-{theme}.svg")
              tree = ET.parse(path)
              root = tree.getroot()
              if root.tag != f"{{{namespace}}}svg" or not root.get("viewBox"):
                  raise ValueError(f"Expected an SVG with a viewBox in {path}")
              root.set("style", f"width:100%;height:100%;background-color:{background}")
              title = ET.Element(f"{{{namespace}}}title")
              title.text = f"Johnpaul’s contribution snake in {theme} mode"
              root.insert(0, title)
              tree.write(path, encoding="utf-8")

      - name: Render the inline close-ups from the generated snakes
        run: python3 scripts/render_snake_preview.py dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contribution-snake
          path: |
            dist/snake-*.svg
            dist/preview-*.svg
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  publish:
    needs: render
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: contribution-snake
          path: assets/snake

      - name: Publish changed animations
        env:
          PROFILE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- assets/snake/snake-{dark,light}.svg assets/snake/preview-{dark,light}.svg
          if git diff --cached --quiet; then
            echo 'The snake and its inline previews are already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh contribution snake'
          for attempt in 1 2 3; do
            git fetch --no-tags origin "$PROFILE_BRANCH"
            if ! git diff --quiet "$GITHUB_SHA" FETCH_HEAD -- .github/workflows/snake.yml scripts/render_snake_preview.py assets/snake; then
              echo 'The snake changed during this run. Regenerate from the latest revision.'
              exit 1
            fi
            git rebase FETCH_HEAD
            if git push origin "HEAD:refs/heads/$PROFILE_BRANCH"; then
              exit 0
            fi
          done
          exit 1

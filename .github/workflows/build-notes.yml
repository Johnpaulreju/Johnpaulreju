name: Update monthly build notes

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monthly-public-build-notes
  cancel-in-progress: false

jobs:
  update:
    if: github.ref_name == github.event.repository.default_branch && github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Update public commit and pull request evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_build_notes.py

      - name: Publish monthly notes
        env:
          PROFILE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- README.md build-notes
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update monthly public build notes'
          for attempt in 1 2 3; do
            git pull --rebase origin "$PROFILE_BRANCH"
            if git push origin "HEAD:refs/heads/$PROFILE_BRANCH"; then exit 0; fi
          done
          exit 1
